<!-- GameHouse Halloween pumpkin pick-and-win game. Paste into a getsitecontrol custom-HTML widget. No external JS, no logos. -->
<link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,700,900&display=swap" rel="stylesheet">
<style>
  .ghp, .ghp * { box-sizing: border-box; }
  .ghp {
    --blue: #2eb2ea; --orange: #ff6b42; --amber: #faa419; --dark: #1d2b36;
    font-family: "Source Sans Pro", Arial, sans-serif; color: #fff; text-align: center;
    max-width: 440px; margin: 0 auto; padding: 24px 20px 28px; border-radius: 6px;
    background: linear-gradient(160deg, #2eb2ea 0%, #1b86b8 100%);
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  .ghp h2 { margin: 0 0 4px; font-size: 30px; font-weight: 900; line-height: 1.1; text-transform: uppercase; letter-spacing: .5px; }
  .ghp p { margin: 0 0 14px; font-size: 16px; opacity: .95; }
  .ghp-stats { display: flex; gap: 10px; justify-content: center; margin: 0 0 14px; }
  .ghp-stat {
    flex: 1; max-width: 160px; background: rgba(29,43,54,.35); border-radius: 4px; padding: 6px 8px;
    font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  }
  .ghp-stat b { display: block; font-size: 24px; font-weight: 900; line-height: 1.1; }
  .ghp-stat.ghp-pop b { animation: ghp-pop .4s ease-out; }
  .ghp-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 330px; margin: 0 auto; }
  .ghp-cell {
    position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 8px; cursor: pointer;
    background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35);
    -webkit-tap-highlight-color: transparent; transition: transform .15s, background .15s;
  }
  .ghp-cell:hover:not([disabled]) { transform: translateY(-3px) rotate(-2deg); background: rgba(255,255,255,.3); }
  .ghp-cell:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .ghp-cell[disabled] { cursor: default; }
  .ghp-cell svg { width: 100%; height: 100%; display: block; padding: 8%; }
  .ghp-cell.ghp-win { background: #ffd24d; box-shadow: inset 0 0 0 3px #fff; }
  .ghp-cell.ghp-miss { background: var(--dark); box-shadow: inset 0 0 0 2px #6a7c8a; }
  .ghp-cell.ghp-lock:not(.ghp-win):not(.ghp-miss) { opacity: .45; }
  .ghp-face { animation: ghp-flip .55s ease-out; }
  .ghp-miss .ghp-face { animation: ghp-flip .55s ease-out, ghp-shake .4s .55s; }
  @keyframes ghp-flip { 0% { transform: scale(.2) rotateY(90deg); opacity: 0; } 70% { transform: scale(1.15) rotateY(0); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes ghp-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes ghp-pop { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
  .ghp-bob { animation: ghp-bob 2.4s ease-in-out infinite; }
  .ghp-cell:nth-child(2n) .ghp-bob { animation-delay: -.8s; }
  .ghp-cell:nth-child(3n) .ghp-bob { animation-delay: -1.6s; }
  @keyframes ghp-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .ghp-msg { margin: 14px 0 0; min-height: 22px; font-size: 16px; font-weight: 700; }
  .ghp-result { display: none; margin-top: 16px; }
  .ghp.ghp-won .ghp-result { display: block; }
  .ghp.ghp-won .ghp-intro { display: none; }
  .ghp-code { display: flex; gap: 8px; align-items: stretch; justify-content: center; margin: 12px auto 0; max-width: 340px; }
  .ghp-code span {
    flex: 1; background: #fff; color: var(--dark); border: 2px dashed var(--orange); border-radius: 4px;
    font: 900 24px "Source Sans Pro", Arial, sans-serif; letter-spacing: 2px; padding: 8px 10px; user-select: all;
  }
  .ghp-btn {
    display: inline-block; border: 0; border-radius: 4px; padding: 8px 16px; font: 700 16px "Source Sans Pro", Arial, sans-serif;
    text-transform: uppercase; color: #fff; background: var(--orange); cursor: pointer; box-shadow: 0 3px 0 #c9482a;
  }
  .ghp-btn:hover { background: #f47d15; }
  .ghp-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .ghp-note { margin-top: 10px; font-size: 14px; min-height: 18px; }
  .ghp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 380px) {
    .ghp { padding: 20px 14px 24px; } .ghp h2 { font-size: 24px; } .ghp-code span { font-size: 20px; } .ghp-grid { gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ghp *, .ghp *::before, .ghp *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="ghp" id="ghp">
  <h2>Pumpkin Patch Picks</h2>
  <p class="ghp-intro">Find 3 treat pumpkins with no more than 2 mistakes. Everyone wins!</p>
  <div class="ghp-stats" aria-hidden="true">
    <div class="ghp-stat" id="ghp-wstat">Winners<b id="ghp-wins">0 / 3</b></div>
    <div class="ghp-stat" id="ghp-mstat">Mistakes<b id="ghp-misses">0 / 2</b></div>
  </div>
  <div class="ghp-grid" id="ghp-grid" role="group" aria-label="Nine pumpkins"></div>
  <div class="ghp-msg" id="ghp-msg" aria-live="polite">Pick a pumpkin to start.</div>
  <div class="ghp-result" id="ghp-result">
    <h2>You found them all!</h2>
    <p>Use this code at checkout:</p>
    <div class="ghp-code">
      <span id="ghp-code">SCARY2026</span>
      <button type="button" class="ghp-btn" id="ghp-copy">Copy</button>
    </div>
    <div class="ghp-note" id="ghp-note" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  var COUPON = "SCARY2026", WINS_NEEDED = 3, MAX_MISSES = 2;
  var root = document.getElementById("ghp"), grid = document.getElementById("ghp-grid"),
      winsEl = document.getElementById("ghp-wins"), missesEl = document.getElementById("ghp-misses"),
      msg = document.getElementById("ghp-msg"), copyBtn = document.getElementById("ghp-copy"),
      note = document.getElementById("ghp-note"), cells = [], picks = 0, wins = 0, misses = 0, outcomes = [];

  var PUMPKIN = '<svg viewBox="0 0 100 100" class="ghp-bob" aria-hidden="true">' +
    '<path d="M50 24c-4-8-2-14 4-17" fill="none" stroke="#3f7d2a" stroke-width="6" stroke-linecap="round"/>' +
    '<ellipse cx="30" cy="58" rx="24" ry="30" fill="#e8590c"/><ellipse cx="70" cy="58" rx="24" ry="30" fill="#e8590c"/>' +
    '<ellipse cx="50" cy="58" rx="22" ry="32" fill="#ff6b42"/><path d="M50 27v62M36 30c-9 14-9 42 0 56M64 30c9 14 9 42 0 56" fill="none" stroke="#c9482a" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M50 26c10-12 22-8 24-4-8 0-14 2-24 4z" fill="#4c9a32"/></svg>';
  // Winner: a wrapped candy treat. Miss: a spooky ghost.
  var TREAT = '<svg viewBox="0 0 100 100" class="ghp-face" aria-hidden="true">' +
    '<path d="M24 50 6 36v28zM76 50l18-14v28z" fill="#e8590c"/><circle cx="50" cy="50" r="28" fill="#ff6b42"/>' +
    '<path d="M50 22a28 28 0 0 1 0 56z" fill="#e8590c"/><path d="M30 34a28 28 0 0 1 14-9" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>' +
    '<path d="M44 40l6-8 6 8 8 2-6 7 2 9-10-4-10 4 2-9-6-7z" fill="#ffd24d" transform="translate(0 2)"/></svg>';
  var GHOST = '<svg viewBox="0 0 100 100" class="ghp-face" aria-hidden="true">' +
    '<path d="M18 90V48a32 32 0 0 1 64 0v42l-11-9-10 9-11-9-11 9-10-9z" fill="#f2f2f2"/>' +
    '<ellipse cx="38" cy="46" rx="6" ry="9" fill="#1d2b36"/><ellipse cx="62" cy="46" rx="6" ry="9" fill="#1d2b36"/>' +
    '<ellipse cx="50" cy="68" rx="7" ry="9" fill="#1d2b36"/></svg>';

  // Picks 1-4 hold exactly 2 winners and 2 misses in random order; pick 5 is always a winner.
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  outcomes = shuffle([true, true, false, false]).concat([true]);

  function bump(el) { var p = el.parentNode; p.classList.remove("ghp-pop"); void p.offsetWidth; p.classList.add("ghp-pop"); }

  function pick(cell) {
    if (cell.disabled || wins >= WINS_NEEDED) return;
    var win = outcomes[picks++];
    cell.disabled = true;
    cell.classList.add(win ? "ghp-win" : "ghp-miss");
    cell.innerHTML = win ? TREAT : GHOST;
    cell.setAttribute("aria-label", win ? "Treat! Winner" : "Boo! Miss");
    if (win) { wins++; winsEl.textContent = wins + " / " + WINS_NEEDED; bump(winsEl); }
    else { misses++; missesEl.textContent = misses + " / " + MAX_MISSES; bump(missesEl); }
    if (wins >= WINS_NEEDED) {
      cells.forEach(function (c) { c.disabled = true; c.classList.add("ghp-lock"); });
      msg.textContent = "Third treat found!";
      root.classList.add("ghp-won");
      setTimeout(function () { copyBtn.focus(); }, 0);
    } else {
      msg.textContent = win ? "A treat! " + wins + " of " + WINS_NEEDED + " found." : "Boo! A mistake. " + misses + " of " + MAX_MISSES + " used.";
    }
  }

  for (var i = 0; i < 9; i++) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "ghp-cell"; b.innerHTML = PUMPKIN;
    b.setAttribute("aria-label", "Pumpkin " + (i + 1));
    b.addEventListener("click", (function (el) { return function () { pick(el); }; })(b));
    grid.appendChild(b); cells.push(b);
  }

  copyBtn.addEventListener("click", function () {
    function ok() { note.textContent = "Code copied!"; copyBtn.textContent = "Copied"; }
    function fallback() {
      var r = document.createRange(); r.selectNodeContents(document.getElementById("ghp-code"));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand("copy") ? ok() : (note.textContent = "Press Ctrl/Cmd+C to copy"); }
      catch (e) { note.textContent = "Press Ctrl/Cmd+C to copy"; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(COUPON).then(ok, fallback);
    else fallback();
  });
})();
</script>
