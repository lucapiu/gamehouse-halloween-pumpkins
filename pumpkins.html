<!-- Halloween pumpkin pick-and-win game. Paste into a getsitecontrol custom-HTML widget. No external JS, no logos. -->
<link href="https://fonts.googleapis.com/css?family=Creepster&family=Nunito:700,900&display=swap" rel="stylesheet">
<style>
  .ghp, .ghp * { box-sizing: border-box; }
  .ghp {
    --orange: #ff7a1a; --amber: #ffb627; --purple: #6b2fa0; --night: #140a24; --ink: #fff4e0;
    position: relative; overflow: hidden; isolation: isolate;
    font-family: "Nunito", "Trebuchet MS", Arial, sans-serif; color: var(--ink); text-align: center;
    max-width: 440px; margin: 0 auto; padding: 26px 20px 28px; border-radius: 14px;
    background: radial-gradient(ellipse at 50% 0%, #4a1d78 0%, #2a1250 45%, var(--night) 100%);
    border: 3px solid var(--orange); box-shadow: 0 0 0 4px #140a24, 0 10px 36px rgba(0,0,0,.6), 0 0 28px rgba(255,122,26,.35);
  }
  .ghp > * { position: relative; z-index: 1; }
  .ghp-deco { position: absolute; z-index: 0; pointer-events: none; }
  .ghp-web-l { top: 0; left: 0; width: 84px; opacity: .55; }
  .ghp-web-r { bottom: 0; right: 0; width: 84px; opacity: .45; transform: rotate(180deg); }
  .ghp h2 {
    margin: 0 0 6px; padding: 0 30px; font: 400 36px/1 "Creepster", "Chalkduster", Impact, fantasy; letter-spacing: 1.5px; color: var(--orange);
    text-shadow: 0 2px 0 #7a2d00, 0 0 18px rgba(255,122,26,.55);
  }
  .ghp p { margin: 0 0 14px; font-size: 16px; font-weight: 700; }
  .ghp-stats { display: flex; gap: 10px; justify-content: center; margin: 0 0 14px; }
  .ghp-stat {
    flex: 1; max-width: 160px; border-radius: 10px; padding: 6px 8px; background: rgba(0,0,0,.4);
    border: 2px solid var(--amber); font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
  }
  .ghp-stat b { display: block; font: 400 28px/1.1 "Creepster", "Chalkduster", Impact, fantasy; letter-spacing: 1px; }
  .ghp-stat.ghp-pop b { animation: ghp-pop .4s ease-out; }
  .ghp-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 330px; margin: 0 auto; }
  .ghp-cell {
    position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 12px; cursor: pointer;
    background: radial-gradient(circle at 50% 40%, #4a2380, #1f0e38); box-shadow: inset 0 0 0 2px #7a46b3;
    -webkit-tap-highlight-color: transparent; transition: transform .15s, box-shadow .15s;
  }
  .ghp-cell:hover:not([disabled]) { transform: translateY(-3px) rotate(-2deg); box-shadow: inset 0 0 0 2px var(--orange), 0 0 14px rgba(255,122,26,.6); }
  .ghp-cell:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .ghp-cell[disabled] { cursor: default; }
  .ghp-cell svg { width: 100%; height: 100%; display: block; padding: 8%; }
  .ghp-cell.ghp-win { background: radial-gradient(circle at 50% 40%, #ffd86b, #ff9a1f); box-shadow: inset 0 0 0 3px #fff4e0, 0 0 16px rgba(255,182,39,.8); }
  .ghp-cell.ghp-miss { background: radial-gradient(circle at 50% 40%, #2c4a1f, #0d1a0a); box-shadow: inset 0 0 0 2px #9be15d, 0 0 14px rgba(155,225,93,.45); }
  .ghp-cell.ghp-lock:not(.ghp-win):not(.ghp-miss) { opacity: .4; }
  .ghp-face { animation: ghp-flip .55s ease-out; }
  .ghp-miss .ghp-face { animation: ghp-flip .55s ease-out, ghp-shake .4s .55s; }
  @keyframes ghp-flip { 0% { transform: scale(.2) rotateY(90deg); opacity: 0; } 70% { transform: scale(1.15) rotateY(0); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes ghp-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes ghp-pop { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
  .ghp-bob { animation: ghp-bob 2.4s ease-in-out infinite; }
  .ghp-cell:nth-child(2n) .ghp-bob { animation-delay: -.8s; }
  .ghp-cell:nth-child(3n) .ghp-bob { animation-delay: -1.6s; }
  @keyframes ghp-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .ghp-stats-below { margin: 14px auto 0; max-width: 330px; }
  .ghp-stats-below .ghp-stat { max-width: none; white-space: nowrap; }
  .ghp-msg { margin: 0 0 14px; padding: 10px 12px; color: var(--ink); }
  .ghp-msg-title { font: 400 26px/1.1 "Creepster", "Chalkduster", Impact, fantasy; letter-spacing: 1px; color: var(--amber); margin-bottom: 4px; }
  .ghp-msg-body { font-size: 15px; font-weight: 700; }
  .ghp.ghp-won .ghp-stats { display: none; }
  .ghp-result h2 { font-size: 42px; line-height: 1.05; margin: 2px 0 14px; padding: 0; }
  .ghp-result .deal { display: block; width: 230px; max-width: 100%; margin: 0 auto 18px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .ghp-cta { display: block; width: 100%; padding: 16px 12px; border-radius: 12px; text-decoration: none; font: 900 19px/1 "Nunito", sans-serif; text-transform: uppercase; color: #2a0e00; background: linear-gradient(#ffb627, var(--orange)); box-shadow: 0 4px 0 #a64a00, 0 0 20px rgba(255,122,26,.5); }
  .ghp-cta:hover { filter: brightness(1.08); }
  .ghp-cta:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .ghp.ghp-won .ghp-result { animation: ghp-winpop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes ghp-winpop { from { transform: scale(.6); opacity: 0; } }
  .ghp-result { display: none; margin-top: 12px; }
  .ghp.ghp-won .ghp-result { display: block; }
  .ghp-result p { margin-bottom: 0; }
  @media (max-width: 380px) {
    .ghp { padding: 22px 14px 24px; } .ghp h2 { font-size: 30px; padding: 0 22px; } .ghp-grid { gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ghp *, .ghp *::before, .ghp *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="ghp" id="ghp">
  <svg class="ghp-deco ghp-web-l" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#d9c8f0" stroke-width="1.2"><path d="M0 0v100M0 0l100 100M0 0h100M0 0l60 100M0 0l100 60"/><path d="M0 22q22 4 30-22M0 44q40 8 52-44M0 68q58 10 76-68M0 92q76 12 100-92"/></svg>
  <svg class="ghp-deco ghp-web-r" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#d9c8f0" stroke-width="1.2"><path d="M0 0v100M0 0l100 100M0 0h100M0 0l60 100M0 0l100 60"/><path d="M0 22q22 4 30-22M0 44q40 8 52-44M0 68q58 10 76-68M0 92q76 12 100-92"/></svg>

  <h2>Pumpkin Pickin'</h2>
  <div class="ghp-msg" id="ghp-msg"><div class="ghp-msg-body">Find the 3 treats and dodge the threats. Unlock your biggest discount on an annual membership! No tricks, just treats.</div></div>
  <div class="ghp-grid" id="ghp-grid" role="group" aria-label="Nine pumpkins"></div>
  <div class="ghp-stats ghp-stats-below" aria-live="polite">
    <div class="ghp-stat"><b id="ghp-left">5 picks</b></div>
  </div>
  <div class="ghp-result" id="ghp-result">
    <h2>Boo! You’ve Unlocked Our Best Deal!</h2>
    <svg class="deal" viewBox="0 0 280 120" role="img" aria-label="Over 40% off">
      <path d="M62 60 8 24v72zM218 60l54-36v72z" fill="#6b2fa0"/>
      <rect x="52" y="10" width="176" height="100" rx="50" fill="#8a44c4"/>
      <path d="M140 10h38a50 50 0 0 1 0 100h-38z" fill="#6b2fa0" opacity=".55"/>
      <path d="M78 26a50 50 0 0 1 24-12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"/>
      <text x="140" y="46" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-weight="900" font-size="17" fill="#ffd24d" letter-spacing="2">OVER</text>
      <text x="140" y="85" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-weight="900" font-size="34" fill="#fff4e0">40% OFF</text>
    </svg>
    <a class="ghp-cta" id="ghp-cta" href="https://www.gamehouse.com/promo/2026-10-halloween-trick-or-treat-membership" target="_blank" rel="noopener">Claim your treat</a>
  </div>
</div>

<script>
(function () {
  // The game always lasts exactly 5 picks: picks 1-4 hold 2 treats and 2 threats, pick 5 is the third treat.
  var TREATS_NEEDED = 3, TOTAL_PICKS = 5;
  var root = document.getElementById("ghp"), grid = document.getElementById("ghp-grid"),
      leftEl = document.getElementById("ghp-left"),
      cta = document.getElementById("ghp-cta"), cells = [], picks = 0, wins = 0, misses = 0, outcomes = [];

  var PUMPKIN = '<svg viewBox="0 0 100 100" class="ghp-bob" aria-hidden="true">' +
    '<path d="M50 24c-4-8-2-14 4-17" fill="none" stroke="#5aa832" stroke-width="6" stroke-linecap="round"/>' +
    '<ellipse cx="30" cy="58" rx="24" ry="30" fill="#e8590c"/><ellipse cx="70" cy="58" rx="24" ry="30" fill="#e8590c"/>' +
    '<ellipse cx="50" cy="58" rx="22" ry="32" fill="#ff7a1a"/><path d="M50 27v62M36 30c-9 14-9 42 0 56M64 30c9 14 9 42 0 56" fill="none" stroke="#b83e05" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M50 26c10-12 22-8 24-4-8 0-14 2-24 4z" fill="#5aa832"/></svg>';
  // Treat: a wrapped candy. Threat: a spooky ghost.
  var TREAT = '<svg viewBox="0 0 100 100" class="ghp-face" aria-hidden="true">' +
    '<path d="M24 50 6 36v28zM76 50l18-14v28z" fill="#6b2fa0"/><circle cx="50" cy="50" r="28" fill="#8a44c4"/>' +
    '<path d="M50 22a28 28 0 0 1 0 56z" fill="#6b2fa0"/><path d="M30 34a28 28 0 0 1 14-9" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>' +
    '<path d="M44 40l6-8 6 8 8 2-6 7 2 9-10-4-10 4 2-9-6-7z" fill="#ffd24d" transform="translate(0 2)"/></svg>';
  var GHOST = '<svg viewBox="0 0 100 100" class="ghp-face" aria-hidden="true">' +
    '<path d="M18 90V48a32 32 0 0 1 64 0v42l-11-9-10 9-11-9-11 9-10-9z" fill="#e9f7dc"/>' +
    '<ellipse cx="38" cy="46" rx="6" ry="9" fill="#140a24"/><ellipse cx="62" cy="46" rx="6" ry="9" fill="#140a24"/>' +
    '<ellipse cx="50" cy="68" rx="7" ry="9" fill="#140a24"/></svg>';

  // Picks 1-4 hold exactly 2 treats and 2 threats in random order; pick 5 is always a treat.
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  outcomes = shuffle([true, true, false, false]).concat([true]);

  function bump(el) { var p = el.parentNode; p.classList.remove("ghp-pop"); void p.offsetWidth; p.classList.add("ghp-pop"); }

  function pick(cell) {
    if (cell.disabled || wins >= TREATS_NEEDED) return;
    var win = outcomes[picks++];
    cell.disabled = true;
    cell.classList.add(win ? "ghp-win" : "ghp-miss");
    cell.innerHTML = win ? TREAT : GHOST;
    cell.setAttribute("aria-label", win ? "Treat!" : "Threat!");
    if (win) wins++; else misses++;
    var left = TOTAL_PICKS - picks;
    leftEl.textContent = left === 1 ? "Last pick!" : left === 2 ? "Only 2 picks!" : left + " picks"; bump(leftEl);
    if (wins >= TREATS_NEEDED) {
      cells.forEach(function (c) { c.disabled = true; c.classList.add("ghp-lock"); });
      root.classList.add("ghp-won");
      setTimeout(function () { cta.focus(); }, 0);
    }
  }

  for (var i = 0; i < 9; i++) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "ghp-cell"; b.innerHTML = PUMPKIN;
    b.setAttribute("aria-label", "Pumpkin " + (i + 1));
    b.addEventListener("click", (function (el) { return function () { pick(el); }; })(b));
    grid.appendChild(b); cells.push(b);
  }
})();
</script>
